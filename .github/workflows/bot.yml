name: khooznews-bot

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TELEGRAM_PROXY: ''
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Run bot
        run: python khooznews_bot.py --once
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      - name: Save state
        run: |
          git config user.name "khooznews-bot"
          git config user.email "actions@github.com"
          if [ -f sent_news.json ]; then
            git add sent_news.json
            git diff --cached --quiet || git commit -m "update sent state" -m "generated by khooznews-bot"
            git push
          fi
